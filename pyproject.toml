[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-audit"
version = "0.1.0"
description = "Where is a prediction model miscalibrated, and for whom? Local audits in outcome-learned pockets."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Bernardo Modenesi" },
  { name = "Taoyi Chen" },
  { name = "Sima Najafzadehkhoei" },
  { name = "Lucia Wang" },
  { name = "Ameya Diwan" },
  { name = "Beatrice Knudsen" },
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.6",
  "lightgbm>=4.0", "pyyaml>=6", "igraph>=0.11", "leidenalg>=0.10", "joblib>=1.3",
]
keywords = ["calibration", "fairness", "model auditing", "subgroup analysis", "random forest", "stochastic block model"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
figures = ["matplotlib>=3.8"]
paper = ["statsmodels>=0.14", "matplotlib>=3.8"]   # the paper's simulation and application scripts
# graph-tool (nested SBM, the default pocket map) is not on PyPI: conda install -c conda-forge graph-tool

[project.scripts]
pocket-audit = "pocket_audit.cli:main"

[project.urls]
Repository = "https://github.com/modenesi/pocket-audit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "simulations"]
